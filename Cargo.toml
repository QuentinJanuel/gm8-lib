[workspace]
resolver = "2"
members = ["gml-parser", "gm8exe", "gm8patch", "gm8decompiler", "gm8-detect", "gm8-sprites"]

[profile.release]
codegen-units = 1
opt-level = 3
lto = 'thin'
strip = true

# The small wasm modules' profile: each answers one question per file, so size over speed. A trap
# from a panic just means "unreadable" to a host that uses a fresh instance per file.
[profile.wasm-small]
inherits = "release"
opt-level = "z"
lto = true
panic = "abort"
